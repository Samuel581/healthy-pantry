    tasks_done: ["1.1", "1.2"]
    notes: >
      ./gradlew build and ./gradlew test both pass. Instrumented smoke test compiles/packages
      but not executed (no emulator in sandbox). Bounded review started via `gentle-ai review
      start` (lineage review-ab04fbdab836207d, risk medium, lens review-reliability,
      changed_files 2, changed_lines 52) but not yet finalized before Engram disconnected.
  - pr: 2
