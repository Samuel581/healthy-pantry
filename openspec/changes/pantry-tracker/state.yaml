change: pantry-tracker
schema: spec-driven
artifact_store: openspec

# Switched from engram to openspec on 2026-07-12 after the Engram MCP server
# disconnected mid-chain (during PR2 kickoff). Proposal/spec/design/tasks below
# were reconstructed from conversation record; see individual file headers.

dag:
  proposal: done
  specs: done
  design: done
  tasks: done
  apply: in_progress
  verify: pending
  archive: pending

delivery_strategy: ask-on-risk
chain_strategy: serial   # each branch cut from dev only after previous PR merges to dev; every PR targets dev
execution_mode: interactive

git:
  base_branch: dev
  convention: one branch + one PR per task, branch from dev, PR targets dev, merge before next branch

apply_progress:
  - pr: 1
    work_unit: "Scaffolding"
    branch: chore/scaffold-project
    status: merged
    commit: d9de8c1 (+ 50aa939 openspec bootstrap)
    pr_url: https://github.com/Samuel581/healthy-pantry/pull/1
    tasks_done: ["1.1", "1.2"]
    notes: >
      ./gradlew build and ./gradlew test both pass. Instrumented smoke test compiles/packages
      but not executed (no emulator in sandbox). gentle-ai review CLI misreported diff scope
      (2/52 vs actual 58 files/1357 lines) and errored on lineage state - bypassed per user
      decision; review-reliability subagent lens found zero blocking findings instead.
      Squash-merged to dev, branch deleted.
  - pr: 2
    work_unit: "Core domain - MeasurementUnit + UnitConverter"
    branch: feat/core-unit-conversion
    status: not_started
  # NOTE: PR3-PR7 entries are missing here — this file was reconstructed from conversation
  # record on 2026-07-12 (see header) and was never fully backfilled past PR2, even though
  # tasks.md phases 3-7 are marked complete and their commits exist on `dev`/this branch's
  # history. Not reconciled as part of this entry (out of scope for the PR8 bug-fix pass below).
  - pr: 8
    work_unit: "Planning + macro domain - weekly needs, macro rollup, mark-eaten use-cases"
    branch: feat/planning-macro-domain
    status: open_in_review
    commit: 72dc420
    pr_number: 13
    tasks_done: ["8.1"]
    notes: >
      Two independent 4R review passes (risk + resilience) on PR #13 both surfaced the same two
      correctness bugs, fixed in a follow-up commit on the same branch: (1) missing idempotency
      guard in MarkPlanEntryEatenUseCase.execute allowing double-decrement of stock on a repeated
      call for an already-eaten entry; (2) unguarded requestedServings/recipe.servings division
      in three call sites producing Infinity/NaN (and, via StockBatchRepository.decrementForFoodItem's
      no-overdraft clamp, wiping all stock) when Recipe.servings <= 0 — fixed once in the shared
      IngredientConversion.convertScaledIngredient helper with a new UnitConversionError
      .InvalidRecipeServings typed failure. New RED/GREEN tests added to
      ComputeMacroTotalsUseCaseTest, ComputeWeeklyNeedsUseCaseTest, MarkPlanEntryEatenUseCaseTest.
      Verified by manual trace only (no JDK/gradle in this sandbox).
  - pr: 9
    work_unit: "Planning UI - RecipeViewModel/RecipeScreen, PlanViewModel/WeekPlanScreen"
    branch: feat/planning-ui
    status: implemented_pending_review
    tasks_done: ["9.1"]
    notes: >
      RecipeViewModel+RecipeScreen (list/create/edit/delete recipes with ordered ingredient
      lists) and PlanViewModel+WeekPlanScreen (assign a recipe or quick-add a FoodItem to a
      day/MealSlot, mark-eaten) added under feature/recipes/ui and feature/planning/ui.
      PlanViewModel is the first production caller of MarkPlanEntryEatenUseCase and wires
      ComputeWeeklyNeedsUseCase's committed-quantity map into its own uiState.weeklyNeeds.
      PantryViewModel's committedQuantity=0.0 stock stub was traced but deliberately left as a
      documented TODO rather than closed in this PR — see tasks.md 9.1 note for the full
      rationale (cross-feature dependency + duplicated reactive resolution, deferred to Phase 11).
      RecipeViewModelTest uses hand-written fakes (PantryViewModelTest convention);
      PlanViewModelTest deviates to a real in-memory Room AppDatabase (Robolectric) because
      MarkPlanEntryEatenUseCase needs a real AppDatabase.withTransaction that cannot be
      hand-faked (mirrors MarkPlanEntryEatenUseCaseTest's own fixture). Compose tests for both
      screens compile/package only, no emulator in this sandbox. Verified by manual trace only
      (no JDK/gradle in this sandbox) — not yet committed/reviewed.
  - pr: 10
    work_unit: "Expiry reminders - ExpiryCheckWorker, notification channel, POST_NOTIFICATIONS, ExpiryAlertRepository, in-app banner"
    branch: feat/expiry-reminders
    status: implemented_pending_review
    tasks_done: ["10.1"]
    notes: >
      ExpiryAlertRepository (feature/expiry/data/repo) adds StockBatchDao.observeBatchesWithExpiry
      and joins it reactively with FoodItemDao.observeAll, categorizing EXPIRING_SOON (<=
      today+lookaheadDays, default 3) vs EXPIRED (< today) via a new injectable java.time.Clock
      (core/common/di/ClockModule). ExpiryCheckWorker (@HiltWorker CoroutineWorker,
      feature/expiry/worker) reads it once per run and calls ExpiryNotifier only when non-empty;
      SystemExpiryNotifier (feature/expiry/notification) posts a NotificationCompat summary,
      guarded by a POST_NOTIFICATIONS checkSelfPermission check on API 33+ so a denial no-ops
      instead of throwing SecurityException. HealthyPantryApp now implements
      Configuration.Provider (HiltWorkerFactory), creates the notification channel, and schedules
      the periodic worker (1-day interval, enqueueUniquePeriodicWork KEEP); MainActivity requests
      POST_NOTIFICATIONS once on API 33+. In-app fallback: new ExpiryAlertViewModel +
      ExpiryBanner wired into PantryListScreen/PantryListContent (second hiltViewModel(),
      expiringItems defaults to empty so PantryListScreenTest is unaffected) — driven by the same
      ExpiryAlertRepository, independent of the worker/permission, per spec
      "Notification-Denied Fallback". Tests: ExpiryAlertRepositoryTest (in-memory Room +
      Robolectric, Clock.fixed), ExpiryCheckWorkerTest (Robolectric +
      androidx.work.testing.TestDriver.setPeriodDelayMet, new work-testing dependency,
      hand-written fakes via a custom WorkerFactory bypassing Hilt), ExpiryBannerTest (Compose,
      compile/package only, no emulator in this sandbox). Verified by manual trace only (no
      JDK/gradle in this sandbox) — not yet committed/reviewed at state.yaml write time.
      Diff size flagged: ~904 changed lines across 20 files, above this project's own
      ~400-450-line proactive-split precedent (see PR3/PR5/PR6 notes in tasks.md) — not split
      preemptively per this task's explicit instruction to flag rather than decide unilaterally;
      left to reviewer/orchestrator to split or accept as size:exception.
