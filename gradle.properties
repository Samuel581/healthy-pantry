# Project-wide Gradle settings.

# JVM heap for the Gradle daemon itself; the default (~512m-1g) is not enough
# headroom for AGP resource merging + KSP (Room/Hilt) + D8 dexing in this project.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Kotlin code style for this project.
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself, avoiding unnecessary
# recompilation.
android.nonTransitiveRClass=true
